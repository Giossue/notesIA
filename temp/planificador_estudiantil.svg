<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024" fill="none"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Planificador Estudiantil</title>
  <desc id="descripcion">Icono vectorial azul con tres tarjetas de tareas del mismo ancho, casillas y líneas alineadas, y un reloj en la esquina inferior derecha. Fondo exterior transparente.</desc>
  <defs>
    <linearGradient id="fondo" x1="125" y1="35" x2="842" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4AA5FF"/>
      <stop offset="0.48" stop-color="#2F93FF"/>
      <stop offset="1" stop-color="#227AF2"/>
    </linearGradient>
    <radialGradient id="luz-fondo" cx="0" cy="0" r="1" gradientTransform="translate(235 105) rotate(48) scale(1110 975)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9E3FF" stop-opacity="0.13"/>
      <stop offset="0.75" stop-color="#B9E3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tarjeta" x1="510" y1="148" x2="510" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.68" stop-color="#FEFFFF"/>
      <stop offset="1" stop-color="#F2F6FE"/>
    </linearGradient>
    <linearGradient id="casilla-azul" x1="215" y1="193" x2="332" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42A9FF"/>
      <stop offset="0.56" stop-color="#248EFF"/>
      <stop offset="1" stop-color="#1275EE"/>
    </linearGradient>
    <linearGradient id="casilla-vacia" x1="215" y1="193" x2="332" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4DDE9"/>
      <stop offset="1" stop-color="#BDCADC"/>
    </linearGradient>
    <linearGradient id="casilla-amarilla" x1="215" y1="193" x2="332" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFDC57"/>
      <stop offset="0.58" stop-color="#FFCA2D"/>
      <stop offset="1" stop-color="#FFB813"/>
    </linearGradient>
    <linearGradient id="lineas" x1="390" y1="219" x2="720" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CED7E4"/>
      <stop offset="1" stop-color="#D6DEEA"/>
    </linearGradient>
    <linearGradient id="borde-reloj" x1="588" y1="568" x2="882" y2="910" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42B4FF"/>
      <stop offset="0.43" stop-color="#2397FF"/>
      <stop offset="0.77" stop-color="#1B81F0"/>
      <stop offset="1" stop-color="#126DDB"/>
    </linearGradient>
    <radialGradient id="esfera" cx="0" cy="0" r="1" gradientTransform="translate(688 674) rotate(51) scale(273)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </radialGradient>
    <linearGradient id="agujas" x1="730" y1="647" x2="786" y2="797" gradientUnits="userSpaceOnUse">
      <stop stop-color="#245292"/>
      <stop offset="1" stop-color="#123B77"/>
    </linearGradient>
    <filter id="sombra-tarjeta" x="-12%" y="-20%" width="124%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="desenfoque"/>
      <feOffset in="desenfoque" dx="0" dy="13" result="desplazada"/>
      <feFlood flood-color="#064ABF" flood-opacity="0.30" result="color"/>
      <feComposite in="color" in2="desplazada" operator="in" result="sombra"/>
      <feMerge><feMergeNode in="sombra"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sombra-casilla" x="-20%" y="-20%" width="140%" height="155%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="desenfoque"/>
      <feOffset in="desenfoque" dy="4" result="desplazada"/>
      <feFlood flood-color="#3662A1" flood-opacity="0.14" result="color"/>
      <feComposite in="color" in2="desplazada" operator="in" result="sombra"/>
      <feMerge><feMergeNode in="sombra"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sombra-reloj" x="-25%" y="-20%" width="150%" height="155%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="desenfoque"/>
      <feOffset in="desenfoque" dx="0" dy="21" result="desplazada"/>
      <feFlood flood-color="#0042A9" flood-opacity="0.38" result="color"/>
      <feComposite in="color" in2="desplazada" operator="in" result="sombra"/>
      <feMerge><feMergeNode in="sombra"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sombra-esfera" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="desenfoque"/>
      <feOffset in="desenfoque" dy="7" result="desplazada"/>
      <feFlood flood-color="#0054C8" flood-opacity="0.38" result="color"/>
      <feComposite in="color" in2="desplazada" operator="in" result="sombra"/>
      <feMerge><feMergeNode in="sombra"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Contenedor: las esquinas exteriores son transparentes. -->
  <g id="contenedor">
    <rect x="24" y="24" width="976" height="976" rx="212" fill="url(#fondo)"/>
    <rect x="24" y="24" width="976" height="976" rx="212" fill="url(#luz-fondo)"/>
  </g>

  <!-- Las tres tarjetas comparten x=142, ancho=736 y alto=232.
       Sus casillas y líneas comparten las mismas coordenadas locales.
       Solo cambia el desplazamiento vertical: 0, 248 y 496. -->
  <g id="tarea-1">
    <rect id="tarjeta-1" x="142" y="148" width="736" height="232" rx="59" fill="url(#tarjeta)" filter="url(#sombra-tarjeta)"/>
    <rect id="casilla-1" x="200" y="192" width="144" height="144" rx="37" fill="url(#casilla-azul)" filter="url(#sombra-casilla)"/>
    <path id="check-1" d="M240 263 L265 288 L307 241" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="texto-1" fill="url(#lineas)">
      <rect x="390" y="219" width="330" height="34" rx="17"/>
      <rect x="390" y="275" width="250" height="34" rx="17"/>
    </g>
  </g>

  <g id="tarea-2" transform="translate(0 248)">
    <rect id="tarjeta-2" x="142" y="148" width="736" height="232" rx="59" fill="url(#tarjeta)" filter="url(#sombra-tarjeta)"/>
    <rect id="casilla-2" x="200" y="192" width="144" height="144" rx="37" fill="url(#casilla-vacia)"/>
    <rect x="221" y="213" width="102" height="102" rx="21" fill="#FFFFFF"/>
    <g id="texto-2" fill="url(#lineas)">
      <rect x="390" y="219" width="330" height="34" rx="17"/>
      <rect x="390" y="275" width="250" height="34" rx="17"/>
    </g>
  </g>

  <g id="tarea-3" transform="translate(0 496)">
    <rect id="tarjeta-3" x="142" y="148" width="736" height="232" rx="59" fill="url(#tarjeta)" filter="url(#sombra-tarjeta)"/>
    <rect id="casilla-3" x="200" y="192" width="144" height="144" rx="37" fill="url(#casilla-amarilla)" filter="url(#sombra-casilla)"/>
    <path id="check-3" d="M240 263 L265 288 L307 241" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="texto-3" fill="url(#lineas)">
      <rect x="390" y="219" width="330" height="34" rx="17"/>
      <rect x="390" y="275" width="250" height="34" rx="17"/>
    </g>
  </g>

  <g id="reloj">
    <circle cx="730" cy="739" r="213" fill="url(#borde-reloj)" filter="url(#sombra-reloj)"/>
    <circle cx="730" cy="735" r="170" fill="url(#esfera)" filter="url(#sombra-esfera)"/>
    <path d="M730 649 V740 L793 788" transform="translate(0 4)" stroke="#1A4986" stroke-opacity="0.13" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="manecillas" d="M730 649 V740 L793 788" stroke="url(#agujas)" stroke-width="33" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
