components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Nombre de la cookie en desarrollo local sin HTTPS.
    secureCookieAuth:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: Nombre de la cookie en producción con HTTPS.
  schemas:
    AccountDeletionCancelInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        confirmation:
          type: string
          const: CANCELAR
      required:
        - password
        - confirmation
      additionalProperties: false
    AccountDeletionRequestInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        confirmation:
          type: string
          const: ELIMINAR
      required:
        - password
        - confirmation
      additionalProperties: false
    AccountDeletionStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - blocked
        blockedReason:
          anyOf:
            - type: string
              enum:
                - last_admin
                - policy_mismatch
            - type: "null"
        requestedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        executeAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
      required:
        - status
        - blockedReason
        - requestedAt
        - executeAt
      additionalProperties: false
    AccountExport:
      type: object
      required:
        - format
        - generatedAt
        - data
      properties:
        format:
          type: string
          const: notesia-export-v1
        generatedAt:
          type: string
          format: date-time
        data:
          type: object
          description: Cada sección de datos personales es un arreglo, incluso si está vacía.
          additionalProperties:
            type: array
            items:
              type: object
    AccountExportRequestInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
      required:
        - password
      additionalProperties: false
    ActivePlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        status:
          type: string
          enum:
            - draft
            - active
            - superseded
            - rejected
        version:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        algorithmVersion:
          type: string
        sourceRevision:
          type: string
          pattern: ^\d+$
        from:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        through:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        minSessionMinutes:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        maxSessionMinutes:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        maxDailyMinutes:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        blocks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              activityId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              startsAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              endsAt:
                type: string
                format: date-time
