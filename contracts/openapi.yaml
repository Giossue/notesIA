openapi: 3.1.0
info:
  title: Student Planner API
  version: 0.1.0
  description: Contrato de /v1 generado desde las rutas Hono y los validadores Zod. Incluye las operaciones de Better Auth expuestas por la aplicación. Las restricciones entre campos se aplican además en el servidor.
servers:
  - url: https://api.example.com/v1
security:
  - cookieAuth: []
  - secureCookieAuth: []
paths:
  /activities:
    get:
      operationId: getActivities
      parameters:
        - in: query
          name: archived
          schema:
            type: boolean
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 256
        - in: query
          name: status
          schema:
            type: string
            enum:
              - backlog
              - planned
              - in_progress
              - completed
              - cancelled
        - in: query
          name: seriesId
          schema:
            type: string
            format: uuid
        - in: query
          name: dueOn
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: dueFrom
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: dueThrough
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        default:
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: postActivities
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreateInput"
      responses:
        "200":
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "201":
          description: Respuesta correcta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        default:
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
