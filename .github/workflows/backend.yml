name: Backend
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://notesia_app:ci-only@127.0.0.1:5432/notesia_dev
      BETTER_AUTH_SECRET: backend-ci-only-secret-with-at-least-32-characters
      ALLOW_SIGNUP: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - name: Prepare local test database
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create role notesia_app login password 'ci-only'"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create database notesia_dev"
      - run: bun run db:test:migrations:local
      - run: bun run db:migrate:local
      - run: bun run db:test:restore:local
      - run: bun run contracts:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test packages/config/src packages/domain/src packages/observability/src apps/api/src apps/worker/src
      - run: bun run build:api
      - run: bun run build:worker
      - run: bun run test:bundle-secrets
