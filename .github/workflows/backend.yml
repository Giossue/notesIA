name: NotesIA
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://notesia_app:ci-only@127.0.0.1:5432/notesia_dev
      BETTER_AUTH_SECRET: backend-ci-only-secret-with-at-least-32-characters
      ALLOW_SIGNUP: "true"
      SMTP_HOST: smtp.example.test
      SMTP_FROM: access@example.test
      NODE_ENV: test
      NOTESIA_API_BASE_URL: https://api.example.invalid/v1
      NOTESIA_CI_DATABASE_MARKER: notesia-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - name: Prepare local test database
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create role notesia_app login password 'ci-only'"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create database notesia_dev"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v marker="$NOTESIA_CI_DATABASE_MARKER" <<'SQL'
          comment on database notesia_dev is :'marker';
          SQL
      - run: bun run db:test:migrations:local
      - run: bun run db:migrate:local
      - run: bun run db:test:restore:local
      - run: bun run contracts:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:admin:e2e
      - run: bun run build
      - name: Build Android release application
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64
      - run: bun run test:bundle-secrets
